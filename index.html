
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>楽器フォトブースAR</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: sans-serif;
}

#camera,
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#stage {
  pointer-events: auto;
}

#ui {
  position: fixed;
  z-index: 2;
  top: 12px;
  left: 12px;
  right: 12px;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

button,
select {
  padding: 10px 12px;
  border: 0;
  border-radius: 999px;
  font-size: 15px;
}

button:disabled {
  opacity: 0.6;
}

#hint {
  display: block;
  width: 100%;
  color: white;
  font-size: 11px;
  margin-top: 6px;
  text-shadow: 0 1px 3px black;
}

#status {
  position: fixed;
  z-index: 2;
  bottom: 12px;
  left: 12px;
  right: 12px;

  padding: 10px;
  color: white;
  background: #0009;
  border-radius: 12px;
  font-size: 12px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="stage"></canvas>

<div id="ui">
  <button id="start">カメラを起動</button>

  <select id="theme">
    <option>コンクール</option>
    <option>式</option>
    <option>野球</option>
  </select>

  <span id="hint">
    カメラ起動後、楽器を指でドラッグして移動できます
  </span>
</div>

<div id="status">
  カメラを起動してください。
</div>

<script type="module">

import * as THREE from 'three';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';


// ==============================
// 楽器ファイル
// ==============================

const files = [
  "Alto sax 2.glb",
  "Alto Sax gold.glb",
  "ClarineteAR用.glb",
  "drum AR用.glb",
  "FluteAR用.glb",
  "French Horn.glb",
  "トロンボーン.glb",
  "Trumpet.glb",
  "tuba AR用.glb"
];


// ==============================
// 楽器の配置
// 数値を小さくして中央に密集
// ==============================

const positions = [

  [-0.18,  0.16, 0.48],
  [ 0.18,  0.16, 0.48],

  [-0.22,  0.00, 0.48],
  [ 0.22,  0.00, 0.52],

  [-0.18, -0.16, 0.52],
  [ 0.18, -0.16, 0.44],

  [-0.10,  0.28, 0.42],
  [ 0.10,  0.28, 0.48],

  [ 0.00, -0.30, 0.56]

];


// ==============================
// HTML要素
// ==============================

const video = document.querySelector("#camera");

const canvas = document.querySelector("#stage");

const status = document.querySelector("#status");

const button = document.querySelector("#start");


// ==============================
// Three.js設定
// ==============================

const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
  innerWidth,
  innerHeight,
  false
);


const scene = new THREE.Scene();


// カメラを大幅に近づける
const camera = new THREE.PerspectiveCamera(
  35,
  innerWidth / innerHeight,
  0.1,
  100
);

camera.position.z = 3;


// ==============================
// ライト
// ==============================

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    3
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  3
);

light.position.set(
  2,
  4,
  6
);

scene.add(light);


// ==============================
// 楽器グループ
// ==============================

const group = new THREE.Group();

scene.add(group);

const movable = [];

let selected = null;

let dragging = false;

let lastPointer = null;


// ==============================
// 読み込み用
// ==============================

const loader = new GLTFLoader();


// ==============================
// カメラ起動
// ==============================

button.addEventListener("click", async () => {

  button.disabled = true;

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "このブラウザではカメラ機能を利用できません"
      );
    }

    status.textContent =
      "カメラを起動しています…";


    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    video.srcObject = stream;

    await video.play();


    status.textContent =
      "楽器を読み込んでいます…";


    // ==============================
    // 楽器を読み込む
    // ==============================

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const gltf =
        await loader.loadAsync(
          "./assets/" +
          encodeURIComponent(files[i])
        );


      const model = gltf.scene;


      // 初期化
      model.scale.setScalar(1);

      model.updateMatrixWorld(true);


      // モデルのサイズを取得
      const box =
        new THREE.Box3().setFromObject(model);

      const size =
        box.getSize(new THREE.Vector3());


      const maxDim =
        Math.max(
          size.x,
          size.y,
          size.z
        ) || 1;


      // 楽器を大きく表示
      const targetSize =
        positions[i][2] * 3.5;


      model.scale.setScalar(
        targetSize / maxDim
      );

      model.updateMatrixWorld(true);


      // モデルの中心を取得
      const center =
        box.getCenter(new THREE.Vector3());


      // 配置
      model.position.set(
        positions[i][0],
        positions[i][1],
        0
      );


      // モデルの原点のずれを補正
      model.position.x -=
        center.x * model.scale.x;

      model.position.y -=
        center.y * model.scale.y;


      // 少し回転
      model.rotation.y = 0.45;


      // グループに追加
      group.add(model);

      movable.push(model);


      status.textContent =
        `読み込み中 ${i + 1}/9`;

    }


    status.textContent =
      "9個の楽器を表示しました。";


  } catch (error) {

    console.error(error);

    status.textContent =
      "起動できませんでした。ブラウザのカメラ許可とHTTPSを確認してください。";

    button.disabled = false;

  }

});


// ==============================
// 楽器選択用
// ==============================

const raycaster =
  new THREE.Raycaster();

const pointer =
  new THREE.Vector2();


function pick(clientX, clientY) {

  const rect =
    canvas.getBoundingClientRect();


  pointer.x =
    ((clientX - rect.left) / rect.width) * 2 - 1;

  pointer.y =
    -((clientY - rect.top) / rect.height) * 2 + 1;


  raycaster.setFromCamera(
    pointer,
    camera
  );


  const hits =
    raycaster.intersectObjects(
      movable,
      true
    );


  if (!hits.length) {
    return null;
  }


  let object =
    hits[0].object;


  while (
    object.parent &&
    object.parent !== group
  ) {
    object = object.parent;
  }


  return object;

}


// ==============================
// 楽器を指で移動
// ==============================

function moveSelected(dx, dy) {

  if (!selected) {
    return;
  }


  // 移動量を小さくして操作しやすくする
  const factor = 0.006;


  selected.position.x +=
    dx * factor;

  selected.position.y -=
    dy * factor;

}


// ==============================
// タッチ・マウス操作
// ==============================

canvas.addEventListener(
  "pointerdown",
  (event) => {

    const hit =
      pick(
        event.clientX,
        event.clientY
      );


    if (hit) {

      selected = hit;

      dragging = true;

      lastPointer = {
        x: event.clientX,
        y: event.clientY
      };


      canvas.setPointerCapture?.(
        event.pointerId
      );


      status.textContent =
        "選択中の楽器を移動中";

    }

  }
);


canvas.addEventListener(
  "pointermove",
  (event) => {

    if (
      !dragging ||
      !selected ||
      !lastPointer
    ) {
      return;
    }


    moveSelected(
      event.clientX - lastPointer.x,
      event.clientY - lastPointer.y
    );


    lastPointer = {
      x: event.clientX,
      y: event.clientY
    };

  }
);


function endDrag() {

  dragging = false;

  lastPointer = null;


  if (selected) {

    status.textContent =
      "指で楽器を移動できます。";

  }

}


canvas.addEventListener(
  "pointerup",
  endDrag
);

canvas.addEventListener(
  "pointercancel",
  endDrag
);


// ==============================
// 画面サイズ変更
// ==============================

window.addEventListener(
  "resize",
  () => {

    renderer.setSize(
      innerWidth,
      innerHeight,
      false
    );


    camera.aspect =
      innerWidth / innerHeight;


    camera.updateProjectionMatrix();

  }
);


// ==============================
// 描画ループ
// ==============================

(function loop() {

  requestAnimationFrame(loop);

  renderer.render(
    scene,
    camera
  );

})();

</script>

</body>
</html>
