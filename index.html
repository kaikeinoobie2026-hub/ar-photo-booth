
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>楽器AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="./styles.css">
  </head>

  <body>

    <a-scene
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: true;
        uiScanning: yes;
        uiLoading: yes;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- GLBモデルを読み込む -->
      <a-assets>
        <a-asset-item
          id="instruments"
          src="./配置済み楽器.glb">
        </a-asset-item>
      </a-assets>

      <!-- マーカーを認識したときに表示 -->
      <a-entity mindar-image-target="targetIndex: 0">

        <a-gltf-model
          src="#instruments"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.7 0.7 0.7">
        </a-gltf-model>

      </a-entity>

      <!-- 照明 -->
      <a-light
        type="ambient"
        intensity="2">
      </a-light>

      <a-light
        type="directional"
        position="1 3 2"
        intensity="1">
      </a-light>

    </a-scene>

  </body>
</html>
