
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>楽器フォトブースAR</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #camera,
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #stage {
      pointer-events: auto;
      touch-action: none;
    }

    #ui {
      position: fixed;
      z-index: 2;
      top: 12px;
      left: 12px;
      right: 12px;

      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    select {
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
    }

    #hint {
      color: white;
      font-size: 11px;
      text-shadow: 0 1px 3px #000;
    }

    #status {
      position: fixed;
      z-index: 2;
      bottom: 12px;
      left: 12px;
      right: 12px;

      padding: 10px;
      color: white;
      background: #0009;
      border-radius: 12px;
      font-size: 12px;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="stage"></canvas>

  <div id="ui">
    <button id="start">カメラを起動</button>

    <select id="theme">
      <option>コンクール</option>
      <option>式</option>
      <option>野球</option>
    </select>

    <span id="hint">
      楽器のフレームを指でドラッグして移動できます
    </span>
  </div>

  <div id="status">
    カメラを起動してください。
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 配置済みの楽器が入っているGLBファイル
    const MODEL_FILE = '配置済み楽器.glb';

    const video = document.querySelector('#camera');
    const canvas = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const startButton = document.querySelector('#start');

    // レンダラー
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight,
      false
    );

    // シーン
    const scene = new THREE.Scene();

    // カメラ
    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 8);

    // ライト
    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      2.5
    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(
      0xffffff,
      2.5
    );

    directionalLight.position.set(2, 4, 6);
    scene.add(directionalLight);

    // GLB全体を入れるグループ
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const loader = new GLTFLoader();

    let loadedModel = null;
    let isLoaded = false;

    // ドラッグ操作用
    let dragging = false;
    let lastPointer = null;

    // カメラ起動・GLB読み込み
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'このブラウザではカメラを利用できません'
          );
        }

        // カメラ起動
        status.textContent = 'カメラを起動しています…';

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: {
                ideal: 'environment'
              }
            },
            audio: false
          });

        video.srcObject = stream;
        await video.play();

        // GLB読み込み
        status.textContent = '配置済みの楽器を読み込んでいます…';

        const filePath =
          './assets/' + encodeURIComponent(MODEL_FILE);

        const gltf = await loader.loadAsync(filePath);

        loadedModel = gltf.scene;

        // モデルのサイズを計測
        loadedModel.scale.setScalar(1);
        loadedModel.updateMatrixWorld(true);

        const box = new THREE.Box3()
          .setFromObject(loadedModel);

        const size = box.getSize(
          new THREE.Vector3()
        );

        const center = box.getCenter(
          new THREE.Vector3()
        );

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        ) || 1;

        // 画面に収まる大きさに自動調整
        const targetSize = 5.2;

        loadedModel.scale.setScalar(
          targetSize / maxDimension
        );

        loadedModel.updateMatrixWorld(true);

        // GLB全体を中央に配置
        loadedModel.position.set(
          -center.x * loadedModel.scale.x,
          -center.y * loadedModel.scale.y,
          -center.z * loadedModel.scale.z
        );

        // 全体の回転
        loadedModel.rotation.y = 0.45;

        modelGroup.add(loadedModel);

        isLoaded = true;

        status.textContent =
          '楽器を表示しました。フレームをドラッグできます。';

      } catch (error) {
        console.error(error);

        status.textContent =
          '読み込みに失敗しました。カメラの許可、HTTPS、GLBの配置を確認してください。';

        startButton.disabled = false;
      }
    });

    // GLB全体をドラッグして移動
    canvas.addEventListener('pointerdown', (event) => {
      if (!isLoaded) return;

      dragging = true;

      lastPointer = {
        x: event.clientX,
        y: event.clientY
      };

      canvas.setPointerCapture?.(event.pointerId);

      status.textContent = 'フレームを移動中…';
    });

    canvas.addEventListener('pointermove', (event) => {
      if (!dragging || !lastPointer || !isLoaded) {
        return;
      }

      const deltaX =
        event.clientX - lastPointer.x;

      const deltaY =
        event.clientY - lastPointer.y;

      // ドラッグ量に応じてGLB全体を移動
      const moveFactor = 0.012;

      modelGroup.position.x +=
        deltaX * moveFactor;

      modelGroup.position.y -=
        deltaY * moveFactor;

      lastPointer = {
        x: event.clientX,
        y: event.clientY
      };
    });

    function endDrag() {
      dragging = false;
      lastPointer = null;

      if (isLoaded) {
        status.textContent =
          'フレームを指で移動できます。';
      }
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', endDrag);

    // 画面サイズ変更対応
    window.addEventListener('resize', () => {
      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();
    });

    // 描画ループ
    function animate() {
      requestAnimationFrame(animate);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
